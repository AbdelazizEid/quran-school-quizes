<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>comp-c — الهامش المذهّب</title>
<style>
  :root { --parchment:#f8f4ec; --ink:#2a1f10; --ink-deep:#1f150a; --gold:#b0884b; --ink-body:#5c4a25; --ink-muted:#6b5a36; --rule:#e6dccb; --wash:#efe4d4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--parchment); color:var(--ink); font-family:"Thmanyah Sans","Segoe UI",Tahoma,sans-serif; min-height:100vh; padding:0 0 6rem; }
  .margin-band { border-inline-start:4px solid var(--gold); margin:3rem 3rem 0; padding:1rem 0; }
  .kicker { font-size:.75rem; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); direction:ltr; display:inline-block; }
  .row { display:flex; align-items:baseline; gap:1rem; }
  main { margin:0 3rem; max-width:72rem; }
  h1 { font-family:"Thmanyah Serif Display","Thmanyah Serif Text","Times New Roman",serif; font-size:clamp(3.5rem,8vw,5rem); line-height:1.1; font-weight:700; margin-top:2rem; }
  h1 em { font-style:normal; color:var(--gold); }
  .ruled { border-top:1px solid var(--rule); margin-top:2.5rem; padding-top:1.5rem; max-width:38rem; }
  .lead { font-size:1.25rem; line-height:1.7; color:var(--ink-body); }
  .ledger { margin-top:3rem; max-width:38rem; }
  .ledger-row { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--rule); padding:1rem .25rem; }
  .ledger-row:last-child { border-bottom:1px solid var(--rule); }
  .ledger-row .who { font-size:1rem; font-weight:600; }
  .ledger-row .what { font-size:.875rem; color:var(--ink-muted); }
  .ledger-row .num { font-family:"Thmanyah Serif Display","Times New Roman",serif; direction:ltr; color:var(--gold); font-weight:700; font-size:1.25rem; }
  .actions { margin-top:3rem; display:flex; gap:1.5rem; flex-wrap:wrap; }
  .btn-primary { background:var(--ink); color:var(--parchment); padding:1rem 2rem; font-size:1.125rem; font-weight:600; border:none; border-radius:12px; font-family:inherit; }
  .btn-outline { background:transparent; color:var(--ink); padding:1rem 2rem; font-size:1.125rem; font-weight:600; border:1px solid var(--gold); border-radius:12px; font-family:inherit; }
</style>
</head>
<body>
<div class="margin-band">
  <div class="row">
    <span class="kicker">DAR MAKKAH — QURAN QUIZ BOARD</span>
  </div>
</div>
<main>
  <h1>كل سؤال<br>له <em>رقم</em> ومقعد.</h1>
  <div class="ruled">
    <p class="lead">دار مكة تحوّل أسئلة القرآن إلى منافسة صفّية: رقم دخول، اسم مستعار، ولوحة نتائج تُكتب أمام الجميع.</p>
  </div>
  <div class="ledger" aria-label="لوحة نتائج تجريبية">
    <div class="ledger-row"><span class="who">مريم</span><span class="what">سرعة الإجابة: ٣ ث</span><span class="num">987</span></div>
    <div class="ledger-row"><span class="who">أحمد</span><span class="what">سرعة الإجابة: ٥ ث</span><span class="num">854</span></div>
    <div class="ledger-row"><span class="who">يوسف</span><span class="what">سرعة الإجابة: ٧ ث</span><span class="num">791</span></div>
  </div>
  <div class="actions">
    <button class="btn-primary">ابدأ جلسة</button>
    <button class="btn-outline">انضمّ برقم الدخول</button>
  </div>
</main>
</body>
</html>
