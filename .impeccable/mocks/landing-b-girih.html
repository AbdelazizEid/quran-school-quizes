<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>comp-b — المشربية</title>
<style>
  :root { --parchment:#f8f4ec; --ink:#2a1f10; --gold:#b0884b; --gold-deep:#8a6b38; --lapis:#23456b; --red:#a33b2e; --ink-body:#5c4a25; --ink-muted:#6b5a36; --rule:#e6dccb; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--parchment); color:var(--ink); font-family:"Thmanyah Sans","Segoe UI",Tahoma,sans-serif; min-height:100vh; display:flex; }
  .lattice { width:220px; flex:none; border-inline-end:2px solid var(--gold); background:
    radial-gradient(circle at 50% 50%, transparent 62%, var(--parchment) 63%),
    conic-gradient(from 22.5deg, var(--rule) 0 45deg, transparent 45deg 90deg) 0 0/44px 44px,
    linear-gradient(var(--parchment), var(--parchment)); position:relative; }
  .lattice::after { content:"دار مكة"; position:absolute; top:50%; right:50%; transform:translate(50%,-50%); writing-mode:vertical-rl; letter-spacing:.4em; font-size:.8rem; color:var(--gold-deep); background:var(--parchment); padding:1rem 0; border-block:3px double var(--red); }
  main { flex:1; padding:3.5rem 3.5rem 5rem; max-width:52rem; }
  .kicker { font-size:.72rem; letter-spacing:.35em; text-transform:uppercase; color:var(--gold-deep); direction:ltr; text-align:start; margin-bottom:1.25rem; }
  h1 { font-family:"Thmanyah Serif Display","Thmanyah Serif Text","Times New Roman",serif; font-size:clamp(2.75rem,6vw,3.8rem); line-height:1.3; font-weight:700; }
  .lead { margin-top:1.25rem; max-width:32rem; font-size:1.15rem; line-height:1.8; color:var(--ink-body); }
  .octa { margin-top:3rem; width:15rem; border:2px solid var(--gold); outline:1px solid var(--lapis); outline-offset:4px; padding:2rem 1.5rem; text-align:center; transform:rotate(0deg); background:var(--parchment); }
  .octa .lbl { font-size:.75rem; letter-spacing:.25em; color:var(--red); text-transform:uppercase; }
  .octa .pin { direction:ltr; font-family:"Thmanyah Serif Display","Times New Roman",serif; font-size:3.2rem; font-weight:700; letter-spacing:.1em; color:var(--ink); margin-top:.5rem; }
  .octa .pin b { color:var(--gold); font-weight:700; }
  .octa .hint { font-size:.8rem; color:var(--ink-muted); margin-top:.5rem; }
  .actions { margin-top:3rem; display:flex; gap:1.25rem; flex-wrap:wrap; }
  .btn-primary { background:var(--ink); color:var(--parchment); padding:1rem 2.2rem; font-size:1.1rem; font-weight:600; border:none; border-radius:2px; font-family:inherit; }
  .btn-outline { background:transparent; color:var(--ink); padding:1rem 2.2rem; font-size:1.1rem; font-weight:600; border:1px solid var(--lapis); border-radius:2px; font-family:inherit; }
  .frieze { margin-top:3.5rem; display:flex; gap:.6rem; }
  .frieze span { width:10px; height:10px; background:var(--gold); transform:rotate(45deg); }
  .frieze span:nth-child(2n) { background:var(--lapis); }
  .frieze span:nth-child(3n) { background:var(--red); }
  @media (max-width:640px) {
    body { flex-direction:column; }
    .lattice { width:auto; height:84px; border-inline-end:none; border-block-end:2px solid var(--gold); background-size:44px 44px; }
    .lattice::after { writing-mode:horizontal-tb; letter-spacing:.35em; padding:0 1rem; border:none; font-size:.8rem; }
    main { padding:2rem 1.25rem 3rem; }
    h1 { font-size:2.2rem; }
    .octa { width:100%; }
    .actions { flex-direction:column; align-items:stretch; }
    .btn-primary,.btn-outline { width:100%; }
  }
</style>
</head>
<body>
<aside class="lattice" aria-hidden="true"></aside>
<main>
  <div class="kicker">DAR MAKKAH — QURAN SCHOOL</div>
  <h1>أسئلة القرآن<br>لمنافسة صفّية مباشرة</h1>
  <p class="lead">أنشئ المعلّم الاختبار، ويدخل الطالب برقم الجلسة واسم مستعار — بلا حساب.</p>
  <div class="octa">
    <div class="lbl">JOIN CODE</div>
    <div class="pin">7<b>4</b>1<b>9</b>2<b>8</b></div>
    <div class="hint">ادخل الرقم ثم اختر اسمك المستعار</div>
  </div>
  <div class="actions">
    <button class="btn-primary">ابدأ جلسةً الآن</button>
    <button class="btn-outline">مكتبة الأسئلة</button>
  </div>
  <div class="frieze" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</main>
</body>
</html>
